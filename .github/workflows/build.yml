name: Build InputDash (Windows x64 Installer & Portable)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Audit zero external process APIs in Rust sources
        shell: pwsh
        run: |
          $forbidden = @("Command" + "::new", "std::" + "process")
          foreach ($pattern in $forbidden) {
            $matches = Select-String -Path "src-tauri/src/**/*.rs" -Pattern $pattern -SimpleMatch
            if ($matches) {
              Write-Error "Forbidden pattern detected: $pattern"
              $matches | Format-Table -AutoSize
              exit 1
            }
          }
          Write-Host "Audit passed: zero external process invocations found."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust stable (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies & build UI
        run: |
          npm install
          npm run build

      - name: Build Tauri NSIS Setup & Release Executable
        run: npx tauri build --bundles nsis

      - name: Prepare portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "portable-dist" -Force | Out-Null
          Copy-Item "src-tauri/target/release/inputdash.exe" "portable-dist/"
          New-Item -ItemType File -Path "portable-dist/.portable" -Force | Out-Null
          New-Item -ItemType Directory -Path "portable-dist/InputDash_data" -Force | Out-Null

      - name: Upload Windows Setup Installer (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: InputDash-Setup-Win64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload Windows Portable (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: InputDash-Portable-Win64
          path: portable-dist/*
          if-no-files-found: error
